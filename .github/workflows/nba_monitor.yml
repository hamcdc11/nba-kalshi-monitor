name: NBA Kalshi Live Monitor

on:
  schedule:
    # Shift 1: Starts daily at 12:00 PST (20:00 UTC) to cover weekend matinees and 14:00+ PST early slates
    - cron: '0 20 * * *'
    # Shift 2: Starts daily at 17:00 PST (01:00 UTC) to cover evening East & West Coast slates
    - cron: '0 1 * * *'
  workflow_dispatch:  # Allows manual trigger anytime from the Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # 5h 40m safety cap (safely under GitHub's 6-hour hard limit)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run NBA Kalshi Monitor
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python nba_prediction_monitor.py
